name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Lint, format and typecheck load no native addon.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Build only the native addon the tests load: better-sqlite3. sharp and
      # onnxruntime-node (@huggingface/transformers, used by the neural
      # retrieval-quality suite) ship prebuilt binaries; the onnxruntime-node
      # install script only downloads optional CUDA libraries.
      - run: npm rebuild better-sqlite3
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # docs:check opens an in-memory better-sqlite3 database.
      - run: npm rebuild better-sqlite3
      - run: npm run build
      - name: Verify dist output
        run: |
          test -f dist/mcp/server.js
          test -f dist/cli/index.js
          test -f dist/core/index.js
      - name: Check generated docs (run `npm run docs:gen` to update)
        run: npm run docs:check
