version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # undici 8 requires Node.js >= 22.19; libscope supports Node.js 20.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/sdk/python"
    target-branch: "development"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    target-branch: "development"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
