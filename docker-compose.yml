services:
  libscope:
    build: .
    ports:
      - "3378:3378" # REST API
    volumes:
      - libscope-data:/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LIBSCOPE_API_KEY=${LIBSCOPE_API_KEY:-}
    restart: unless-stopped

  # Optional: Ollama for local embeddings
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - local
    restart: unless-stopped

volumes:
  libscope-data:
  ollama-data:
